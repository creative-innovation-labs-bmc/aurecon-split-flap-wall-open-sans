name: Correct all small-flap typography

on:
  push:
    paths:
      - "tools/patch_all_small_flaps_open_sans.py"
      - "tools/qc_all_small_flaps_open_sans.mjs"
      - ".github/workflows/patch-all-small-flaps-open-sans.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-all-small-flap-typography
  cancel-in-progress: true

jobs:
  patch-and-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone original pre-fork wall
        run: git clone --depth 1 https://github.com/creative-innovation-labs-bmc/aurecon-split-flap-wall.git /tmp/original-wall

      - name: Apply corrected typography scope
        run: |
          test -s fonts/OpenSans-Variable.ttf
          test -s fonts/OFL.txt
          python3 tools/patch_all_small_flaps_open_sans.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium QC runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Run native and original-macro comparison QC
        run: |
          mkdir -p qc
          python3 -m http.server 8000 --directory . >/tmp/open-sans-3-server.log 2>&1 &
          python3 -m http.server 8001 --directory /tmp/original-wall >/tmp/original-wall-server.log 2>&1 &
          sleep 2
          node tools/qc_all_small_flaps_open_sans.mjs

      - name: Clean temporary dependencies
        if: always()
        run: rm -rf node_modules package.json package-lock.json

      - name: Commit corrected production build and QC
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use Open Sans Bold on all small flaps and preserve original 4x5 clock [skip ci]"
          git pull --rebase origin main
          git push
