name: Final typography QC

on:
  push:
    paths:
      - "tools/qc_typography_final.mjs"
      - ".github/workflows/final-typography-qc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run final native QC
        run: |
          python3 -m http.server 8000 >/tmp/final-typography-server.log 2>&1 &
          sleep 2
          node tools/qc_typography_final.mjs
      - name: Clean runtime dependencies
        if: always()
        run: rm -rf node_modules package.json package-lock.json
      - name: Commit final report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qc
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record passing final typography QC [skip ci]"
          git pull --rebase origin main
          git push
