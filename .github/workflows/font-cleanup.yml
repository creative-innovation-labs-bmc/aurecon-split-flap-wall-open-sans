name: One-time font cleanup

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-approved font fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wall-live.css')
          text = p.read_text()
          text = text.replace('font-family: "Open Sans", Arial, sans-serif;', 'font-family: "Open Sans";')
          p.write_text(text)
          PY
          ! grep -RInE 'Arial|Helvetica|Georgia|Times New Roman|Noto Serif|monospace|Meta Serif|Meta Sans|Bitter|Aptos|Roboto|MP-B' . --exclude-dir=.git --include='*.html' --include='*.css' --include='*.js'
          while IFS= read -r f; do
            case "$(basename "$f")" in
              OpenSans-*) ;;
              *) echo "Unapproved font asset: $f"; exit 1 ;;
            esac
          done < <(find fonts -type f \( -name '*.ttf' -o -name '*.otf' -o -name '*.woff' -o -name '*.woff2' \))
          rm .github/workflows/font-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy font fallbacks"
          git push
